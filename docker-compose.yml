services:
  agent-host:
    container_name: agent-host
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-host:latest
    restart: unless-stopped
    ports:
      - "3116:3116"
    volumes:
      # Persist configuration (OpenRouter keys, fallbacks, council settings, rooms)
      - ./config.json:/app/config.json
      # Persist Graphify knowledge graph outputs
      - ./graphify-out:/app/graphify-out
    environment:
      - PYTHONUNBUFFERED=1

name: Deploy Agent Host

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ucyenyen/agent-telemetry

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pcntl, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      # Some runner addresses intermittently can't reach the VPS, so retry the connection.
      # ssh exits 255 only when it could not connect; any other code came from deploy.sh itself.
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/key"

          for attempt in 1 2 3 4 5 6; do
            status=0
            ssh -i "$RUNNER_TEMP/key" -p "$VPS_PORT" \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 \
              "$VPS_USER@$VPS_HOST" \
              "/var/www/PersonalProject/llm/docker/deploy.sh deploy $BRANCH $TOKEN" || status=$?

            [ "$status" -ne 255 ] && exit "$status"
            echo "::warning::SSH connection failed (attempt $attempt), retrying in 20s"
            sleep 20
          done

          exit 1
